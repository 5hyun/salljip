services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: ${RESTART_POLICY:-no}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-housing_lab}
      POSTGRES_USER: ${POSTGRES_USER:-housing_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-housing_lab}
    volumes: [housing_lab_db:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${DB_PORT:-15432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-housing_lab} -d ${POSTGRES_DB:-housing_lab}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  api:
    build: ./apps/api
    restart: ${RESTART_POLICY:-no}
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-housing_lab}
      DATABASE_USERNAME: ${POSTGRES_USER:-housing_lab}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-housing_lab}
      HOUSING_LAB_DEMO_MODE: ${HOUSING_LAB_DEMO_MODE:-true}
      SEOUL_OPEN_DATA_KEY: ${SEOUL_OPEN_DATA_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports: ["${API_PORT:-18080}:8080"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [backend, frontend]
  web:
    restart: ${RESTART_POLICY:-no}
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18080}
        NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${NEXT_PUBLIC_NAVER_MAP_CLIENT_ID:-}
        NEXT_PUBLIC_MAP_PROVIDER: ${NEXT_PUBLIC_MAP_PROVIDER:-naver}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
    networks: [frontend]
networks:
  backend: {internal: true}
  frontend:
volumes:
  housing_lab_db:
