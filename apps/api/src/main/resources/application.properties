spring.application.name=housing-lab-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/housing_lab}
spring.datasource.username=${DATABASE_USERNAME:housing_lab}
spring.datasource.password=${DATABASE_PASSWORD:housing_lab}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Housing Opportunity Lab
info.app.version=0.1.0
server.error.include-message=always
housing-lab.demo-mode=${HOUSING_LAB_DEMO_MODE:true}
seoul.open-data-key=${SEOUL_OPEN_DATA_KEY:}
housing-lab.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
housing-lab.molit.base-url=https://apis.data.go.kr/1613000
housing-lab.molit.api-key=${MOLIT_API_KEY:}
housing-lab.vworld.api-key=${VWORLD_API_KEY:}
# 외부 API 사용량 (관리자 페이지 /admin/usage)
housing-lab.admin-token=${ADMIN_TOKEN:}
# 이 기기 이름: mac / minipc
housing-lab.usage.source=${USAGE_SOURCE:local}
# 값이 있으면 이 기기가 보내는 쪽이 된다(Mac). 미니PC는 비워 둔다.
housing-lab.usage.sync-url=${USAGE_SYNC_URL:}
housing-lab.usage.sync-token=${USAGE_SYNC_TOKEN:}
housing-lab.usage.sync-cron=${USAGE_SYNC_CRON:0 50 23 * * *}
# 일일 한도(0 = 미설정). 계정 등급에 맞게 직접 넣는다.
housing-lab.usage.limit.molit=${USAGE_LIMIT_MOLIT:0}
housing-lab.usage.limit.vworld=${USAGE_LIMIT_VWORLD:0}
housing-lab.usage.limit.seoul_open_data=${USAGE_LIMIT_SEOUL_OPEN_DATA:0}
housing-lab.usage.limit.naver_map=${USAGE_LIMIT_NAVER_MAP:0}
