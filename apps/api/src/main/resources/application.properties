spring.application.name=housing-lab-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/housing_lab}
spring.datasource.username=${DATABASE_USERNAME:housing_lab}
spring.datasource.password=${DATABASE_PASSWORD:housing_lab}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Housing Opportunity Lab
info.app.version=0.1.0
server.error.include-message=always
housing-lab.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
housing-lab.molit.base-url=https://apis.data.go.kr/1613000
housing-lab.molit.api-key=${MOLIT_API_KEY:}
housing-lab.vworld.api-key=${VWORLD_API_KEY:}
